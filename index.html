<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Eyes | Pakistan's First Subscription Service</title>
    <meta name="description" content="My Eyes — Pakistan's first eyewear subscription service. Premium frames, expert opticians, fast delivery across Pakistan." />

    <!-- Flash-free theme initialization (runs BEFORE any render) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme_preference');
          var theme = (stored === 'dark' || stored === 'light')
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
        } catch(e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              spectra: {
                navy: '#0F0F0F',
                orange: '#FF5722',
                amber: '#FFC107',
                light: '#FFFFFF',
                offwhite: '#F9FAFB',
                card: '#F3F4F6',
                border: '#E5E7EB',
                // Dark mode palette
                'dark-bg': '#1F1F23',
                'dark-surface': '#27272B',
                'dark-card': '#303036',
                'dark-border': '#3F3F46',
                'dark-text': '#E4E4E7',
                'dark-muted': '#A1A1AA',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            borderRadius: {
              '4xl': '2.5rem',
              '5xl': '3rem',
            },
            backgroundImage: {
              'logo-gradient': 'linear-gradient(135deg, #FFC107 0%, #FF5722 100%)',
            }
          }
        }
      }
    </script>
    <style>
      /* Global dark mode overrides for existing components */
      .dark .bg-white { background-color: #27272B !important; }
      .dark .bg-gray-50, .dark .bg-gray-100 { background-color: #303036 !important; }
      .dark .text-spectra-navy { color: #E4E4E7 !important; }
      .dark .text-gray-600, .dark .text-gray-500 { color: #A1A1AA !important; }
      .dark .text-gray-400 { color: #71717A !important; }
      .dark .border-gray-100, .dark .border-gray-200 { border-color: #3F3F46 !important; }
      .dark .bg-blue-50, .dark .bg-orange-50, .dark .bg-teal-50 { background-color: #303036 !important; }
      .dark .hover\:shadow-xl:hover { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4) !important; }
    </style>
  <!-- Vite handles all module imports from node_modules -->
</head>
  <body>
    <div id="connection-test" style="position:fixed; top:0; left:0; background:red; color:white; padding:5px; z-index:9999;">PAGE LOADED</div>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
