<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MY EYES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
        }
        .form-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }
        .input-field {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }
        .input-field.error {
            border-color: #ef4444;
        }
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 6px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .button-submit {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .button-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(147, 51, 234, 0.3);
        }
        .button-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .alert-error {
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
        }
        .alert-error.show {
            display: block;
        }
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            animation: spin 1s linear infinite;
        }
        .loading-spinner.show {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .forgot-password {
            color: #9333ea;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .forgot-password:hover {
            color: #7c3aed;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="form-container w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8 p-8 pb-0">
            <div class="inline-block mb-4 text-4xl font-bold gradient-bg text-transparent bg-clip-text">
                👁️ MY EYES
            </div>
            <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
            <p class="text-gray-600 mt-2">Log in to your account</p>
        </div>

        <!-- Alert Messages -->
        <div class="px-8 pt-6">
            <div class="alert-error" id="alertError"></div>
        </div>

        <!-- Form -->
        <form id="loginForm" class="px-8 py-6" novalidate>
            <!-- Email -->
            <div class="mb-5">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    Email Address
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="input-field w-full"
                    placeholder="you@example.com"
                    required
                />
                <div class="error-message" id="emailError"></div>
            </div>

            <!-- Password -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-2">
                    <label for="password" class="block text-sm font-semibold text-gray-700">
                        Password
                    </label>
                    <a href="#" class="forgot-password">Forgot?</a>
                </div>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="input-field w-full"
                    placeholder="Enter your password"
                    required
                />
                <div class="error-message" id="passwordError"></div>
            </div>

            <!-- Remember Me -->
            <div class="mb-6 flex items-center">
                <input
                    type="checkbox"
                    id="rememberMe"
                    name="remember_me"
                    class="w-4 h-4 cursor-pointer"
                />
                <label for="rememberMe" class="text-sm text-gray-600 ml-3 cursor-pointer">
                    Remember me
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="button-submit w-full flex items-center justify-center gap-2">
                <span id="buttonText">Log In</span>
                <div class="loading-spinner" id="loadingSpinner"></div>
            </button>
        </form>

        <!-- Signup Link -->
        <div class="text-center pb-8 px-8">
            <p class="text-gray-600">
                Don't have an account?
                <a href="signup.html" class="text-purple-600 font-semibold hover:text-purple-700">
                    Sign Up
                </a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                await handleLogin(this);
            });
        });
    </script>
</body>
</html>
