<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MY EYES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        }
        .form-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }
        .input-field {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }
        .input-field.error {
            border-color: #ef4444;
        }
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 6px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .button-submit {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .button-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(249, 115, 22, 0.3);
        }
        .button-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .success-message {
            background: #ecfdf5;
            border: 2px solid #10b981;
            color: #065f46;
            padding: 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
        }
        .success-message.show {
            display: block;
        }
        .alert-error {
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
        }
        .alert-error.show {
            display: block;
        }
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            animation: spin 1s linear infinite;
        }
        .loading-spinner.show {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .password-strength {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .password-strength-bar.weak {
            background: #ef4444;
            width: 33%;
        }
        .password-strength-bar.fair {
            background: #f59e0b;
            width: 66%;
        }
        .password-strength-bar.strong {
            background: #10b981;
            width: 100%;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="form-container w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8 p-8 pb-0">
            <div class="inline-block mb-4 text-4xl font-bold gradient-bg text-transparent bg-clip-text">
                👁️ MY EYES
            </div>
            <h1 class="text-3xl font-bold text-gray-900">Create Account</h1>
            <p class="text-gray-600 mt-2">Join us for personalized eyewear experience</p>
        </div>

        <!-- Alert Messages -->
        <div class="px-8 pt-6">
            <div class="success-message" id="successMessage">
                ✓ Account created successfully! Redirecting...
            </div>
            <div class="alert-error" id="alertError"></div>
        </div>

        <!-- Form -->
        <form id="signupForm" class="px-8 py-6" novalidate>
            <!-- Full Name -->
            <div class="mb-5">
                <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-2">
                    Full Name
                </label>
                <input
                    type="text"
                    id="fullName"
                    name="full_name"
                    class="input-field w-full"
                    placeholder="John Doe"
                    required
                />
                <div class="error-message" id="fullNameError"></div>
            </div>

            <!-- Email -->
            <div class="mb-5">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    Email Address
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="input-field w-full"
                    placeholder="you@example.com"
                    required
                />
                <div class="error-message" id="emailError"></div>
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="input-field w-full"
                    placeholder="At least 6 characters"
                    required
                />
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="error-message" id="passwordError"></div>
                <p class="text-xs text-gray-500 mt-2">
                    Password must be at least 6 characters long
                </p>
            </div>

            <!-- Confirm Password -->
            <div class="mb-6">
                <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">
                    Confirm Password
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    class="input-field w-full"
                    placeholder="Re-enter password"
                    required
                />
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <!-- Terms -->
            <div class="mb-6 flex items-start">
                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    class="mt-1 mr-3 w-4 h-4 cursor-pointer"
                    required
                />
                <label for="terms" class="text-sm text-gray-600 cursor-pointer">
                    I agree to the Terms of Service and Privacy Policy
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="button-submit w-full flex items-center justify-center gap-2">
                <span id="buttonText">Create Account</span>
                <div class="loading-spinner" id="loadingSpinner"></div>
            </button>
        </form>

        <!-- Login Link -->
        <div class="text-center pb-8 px-8">
            <p class="text-gray-600">
                Already have an account?
                <a href="login.html" class="text-purple-600 font-semibold hover:text-purple-700">
                    Log In
                </a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('signupForm');
            const passwordInput = document.getElementById('password');
            const strengthBar = document.getElementById('strengthBar');

            // Password strength indicator
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                let strength = '';
                
                if (password.length === 0) {
                    strengthBar.className = 'password-strength-bar';
                } else if (password.length < 6) {
                    strengthBar.className = 'password-strength-bar weak';
                } else if (password.length < 10 || !/[^a-zA-Z0-9]/.test(password)) {
                    strengthBar.className = 'password-strength-bar fair';
                } else {
                    strengthBar.className = 'password-strength-bar strong';
                }
            });

            // Form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                await handleSignup(this);
            });
        });
    </script>
</body>
</html>
