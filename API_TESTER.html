<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY EYES - Authentication API Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e5e5e5;
        }

        .response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            background: #f5f5f5;
            border: 1px solid #ddd;
        }

        .response.success {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .response.error {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .token-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }

        .token-section label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
        }

        .token-value {
            background: white;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #666;
            border: 1px solid #ddd;
            max-height: 100px;
            overflow-y: auto;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status.ok {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👓 MY EYES - Authentication API Tester</h1>
            <p>Test authentication endpoints: signup, login, and get current user</p>
        </div>

        <div class="grid">
            <!-- Signup Card -->
            <div class="card">
                <h2>📝 User Signup</h2>
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signup-name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" placeholder="At least 6 characters" required>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-primary">Sign Up</button>
                        <button type="button" class="btn-secondary" onclick="clearSignupResponse()">Clear</button>
                    </div>
                </form>
                <div id="signup-response" class="response" style="display: none;"></div>
            </div>

            <!-- Login Card -->
            <div class="card">
                <h2>🔐 User Login</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Your password" required>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-primary">Login</button>
                        <button type="button" class="btn-secondary" onclick="clearLoginResponse()">Clear</button>
                    </div>
                </form>
                <div id="login-response" class="response" style="display: none;"></div>
            </div>

            <!-- Get Current User Card -->
            <div class="card">
                <h2>👤 Get Current User</h2>
                <p style="margin-bottom: 15px; color: #666; font-size: 14px;">
                    ℹ️ You need a valid token from login first
                </p>
                <div class="button-group">
                    <button class="btn-primary" onclick="handleGetUser()">Get Current User</button>
                    <button class="btn-secondary" onclick="clearUserResponse()">Clear</button>
                </div>
                <div id="user-response" class="response" style="display: none;"></div>
            </div>

            <!-- Token Manager Card -->
            <div class="card">
                <h2>🔑 Token Manager</h2>
                <div class="token-section">
                    <label>Current Token:</label>
                    <div class="token-value" id="token-display">No token stored</div>
                </div>
                <div class="button-group" style="margin-top: 15px;">
                    <button class="btn-secondary" onclick="copyToken()">Copy Token</button>
                    <button class="btn-secondary" onclick="clearToken()">Clear Token</button>
                </div>
            </div>

            <!-- API Status Card -->
            <div class="card full-width">
                <h2>📊 API Status</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Server URL</label>
                        <div style="background: #f5f5f5; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; word-break: break-all;">
                            http://localhost:5000
                        </div>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Database</label>
                        <div style="background: #f5f5f5; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px;">
                            SQLite
                        </div>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Status</label>
                        <div id="server-status" style="padding: 10px; border-radius: 4px; font-weight: 600;" class="status">
                            Checking...
                        </div>
                    </div>
                </div>
                <button class="btn-primary" onclick="checkServerStatus()" style="width: 100%; margin-top: 15px;">Check Server Status</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        // Check server status on load
        window.addEventListener('load', () => {
            checkServerStatus();
            loadToken();
        });

        function loadToken() {
            const token = localStorage.getItem('auth_token');
            const display = document.getElementById('token-display');
            if (token) {
                display.textContent = token;
            }
        }

        function saveToken(token) {
            localStorage.setItem('auth_token', token);
            loadToken();
        }

        function getToken() {
            return localStorage.getItem('auth_token');
        }

        async function checkServerStatus() {
            try {
                const response = await fetch('http://localhost:5000/health');
                const data = await response.json();
                const statusDiv = document.getElementById('server-status');
                
                if (response.ok) {
                    statusDiv.textContent = '✓ Online';
                    statusDiv.className = 'status ok';
                } else {
                    statusDiv.textContent = '✗ Error';
                    statusDiv.className = 'status error';
                }
            } catch (error) {
                const statusDiv = document.getElementById('server-status');
                statusDiv.textContent = '✗ Offline';
                statusDiv.className = 'status error';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                const response = await fetch(`${API_BASE}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: name, email, password })
                });

                const data = await response.json();
                displayResponse('signup-response', data, response.ok);

                if (response.ok && data.token) {
                    saveToken(data.token);
                }
            } catch (error) {
                displayResponse('signup-response', { error: error.message }, false);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                displayResponse('login-response', data, response.ok);

                if (response.ok && data.token) {
                    saveToken(data.token);
                }
            } catch (error) {
                displayResponse('login-response', { error: error.message }, false);
            }
        }

        async function handleGetUser() {
            const token = getToken();
            if (!token) {
                displayResponse('user-response', { error: 'No token found. Please login first.' }, false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                displayResponse('user-response', data, response.ok);
            } catch (error) {
                displayResponse('user-response', { error: error.message }, false);
            }
        }

        function displayResponse(elementId, data, isSuccess) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            element.className = `response ${isSuccess ? 'success' : 'error'}`;
            element.style.display = 'block';
        }

        function clearSignupResponse() {
            document.getElementById('signup-response').style.display = 'none';
        }

        function clearLoginResponse() {
            document.getElementById('login-response').style.display = 'none';
        }

        function clearUserResponse() {
            document.getElementById('user-response').style.display = 'none';
        }

        function copyToken() {
            const token = getToken();
            if (!token) {
                alert('No token to copy');
                return;
            }
            navigator.clipboard.writeText(token).then(() => {
                alert('Token copied to clipboard!');
            });
        }

        function clearToken() {
            localStorage.removeItem('auth_token');
            loadToken();
            alert('Token cleared');
        }
    </script>
</body>
</html>
